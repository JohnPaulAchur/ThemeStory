<?php
/* Standalone authentication layout; intentionally does not load the landing header/footer. */
$tsBaseUrl = rtrim(ltSiteUrl(), '/');
$tsAssetBase = $tsBaseUrl . '/packages/themes/ThemeStory/Assets';
?>

<?php
/**
 * ThemeStory Dashboard Layout
 * Site Information: Browser Title and Favicon
 */

// Retrieve configured site information.
$tsSiteName  = trim((string) ltSiteName());
$tsSiteTitle = trim((string) ltSiteTitle());
$tsFavicon   = trim((string) ltSiteFavicon());

// Build the browser title.
$tsBrowserTitle = $tsSiteTitle !== ''
    ? $tsSiteName . ' | ' . $tsSiteTitle
    : ($tsSiteName !== '' ? $tsSiteName : 'ThemeStory');

// Resolve the favicon URL.
$tsFaviconUrl = '';

if ($tsFavicon !== '') {
    // Preserve absolute URLs and root-relative paths.
    if (preg_match('~^(https?:)?//~i', $tsFavicon)
        || str_starts_with($tsFavicon, '/')) {
        $tsFaviconUrl = $tsFavicon;
    } else {
        // Resolve a filename relative to the configured site installation.
        $tsFaviconUrl = rtrim(ltSiteUrl(), '/')
            . '/storage/media/'
            . ltrim($tsFavicon, '/');
    }
}
?>

<title><?= htmlspecialchars(
    $tsBrowserTitle,
    ENT_QUOTES,
    'UTF-8'
) ?></title>

<?php if ($tsFaviconUrl !== ''): ?>
    <link
        rel="icon"
        href="<?= htmlspecialchars($tsFaviconUrl, ENT_QUOTES, 'UTF-8') ?>"
    >
<?php endif; ?>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="<?= htmlspecialchars($tsAssetBase . '/css/dashboard.css', ENT_QUOTES, 'UTF-8') ?>" />
<div class="ts-auth-page">
    <div class="ts-auth-topline">
        <a class="ts-auth-brand" href="<?= htmlspecialchars($tsBaseUrl, ENT_QUOTES, 'UTF-8') ?>"><span
                class="ts-brand-mark"><i
                    class="bi bi-journal-richtext"></i></span><span><strong>ThemeStory</strong><small>Your creative
                    workspace</small></span></a><button type="button" class="ts-icon-button ts-auth-theme-toggle"
            data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
            <i class="bi bi-moon-stars"></i>
        </button>
    </div>
    <main class="ts-auth-content">
        <?php dddm::loadDynamicContent(); ?>
    </main>
</div>
